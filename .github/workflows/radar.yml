name: Market Radar
on:
  schedule:
    - cron: "0 2 * * *"     # 07:30 IST
    - cron: "30 7 * * *"    # 13:00 IST
    - cron: "30 13 * * *"   # 19:00 IST
    - cron: "30 4 * * 0"    # Sunday 10:00 IST weekly digest
  workflow_dispatch:
    inputs:
      mode: {description: "run or weekly", default: "run"}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 4 * * 0" ]; then MODE=weekly; else MODE="${{ github.event.inputs.mode || 'run' }}"; fi
          python -m radar.pipeline $MODE
      - name: Save results
        run: |
          git config user.name "market-radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "radar: update $(date -u +%F\ %H:%M)" && git pull --rebase -q && git push)
